<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코트로그 · 테니스 기록 & 현장 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --court:#17573f; --court-2:#1f7354; --court-dark:#0e3a2a;
  --ball:#d9f24b; --clay:#c4623a; --hard:#2f6db5;
  --bg:#eef1ea; --card:#ffffff; --ink:#15211b; --muted:#66746c; --line:#dde3da;
  --win:#1f8a5b; --loss:#c94a3c; --warn:#d08a14;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:#dfe5dc;color:var(--ink);-webkit-font-smoothing:antialiased}
.num{font-family:'Archivo','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08)}
header.top{background:var(--court);color:#fff;padding:16px 18px 14px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.3px;font-size:18px}
.logo .ball{width:24px;height:24px;border-radius:50%;background:var(--ball);position:relative;overflow:hidden;flex:none}
.logo .ball:before,.logo .ball:after{content:"";position:absolute;width:24px;height:24px;border:2px solid #fff;border-radius:50%;opacity:.9}
.logo .ball:before{left:-15px;top:0}.logo .ball:after{right:-15px;top:0}
.logo small{font-weight:500;opacity:.7;font-size:12px;margin-left:2px}
.sync{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:#aaa;display:inline-block}
.sync.cloud i{background:var(--ball)}.sync.local i{background:#f2b84b}.sync.loading i{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
main{flex:1;padding:16px 16px 100px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{padding:9px 0 10px;white-space:nowrap;letter-spacing:-.4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--court)}
nav.tabs button.on svg{stroke-width:2.3}
h2.sec{font-size:15px;font-weight:700;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2.sec:first-child{margin-top:4px}
h2.sec a,h2.sec button{font-size:12.5px;color:var(--court);font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.hero{background:linear-gradient(150deg,var(--court) 0%,var(--court-dark) 100%);color:#fff;border:none;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border:2px solid rgba(255,255,255,.12);border-radius:8px;transform:rotate(18deg)}
.hero .kick{font-size:12px;opacity:.75}
.hero .big{font-size:22px;font-weight:900;margin:4px 0 14px;letter-spacing:-.4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.1);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:11px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500}
.quick .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#e7f0e9;color:var(--court)}
.quick .ic svg{width:20px;height:20px}
.quick button:nth-child(3) .ic{background:#fdeceb;color:var(--loss)}
.quick button:nth-child(4) .ic{background:#f6f9d6;color:#6c7a12}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;font-family:'Archivo',sans-serif}
.badge.W{background:#e2f3ea;color:var(--win)}.badge.L{background:#fbe6e3;color:var(--loss)}.badge.P{background:#f3f7d4;color:#6c7a12;font-size:12px}.badge.B{background:#e6eef9;color:var(--hard);font-size:12px}
.item .t{font-weight:700;font-size:14px;line-height:1.3}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.item .r{margin-left:auto;text-align:right;font-size:13px;white-space:nowrap}
.item .grow{min-width:0;flex:1}
.item .grow .t,.item .grow .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#eef1ea;color:var(--muted)}
.chip.requested{background:#fff3dc;color:#9a6408}.chip.confirmed{background:#e3eefb;color:var(--hard)}.chip.done{background:#e2f3ea;color:var(--win)}.chip.canceled{background:#eee;color:#888}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 12px;background:#fff;border:1px dashed #cfd7cd;border-radius:14px;line-height:1.6}
.empty button{margin-top:10px}
.btn{background:var(--court);color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--court);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--loss);border:1px solid #f0cfca}
.btn.ball{background:var(--ball);color:var(--court-dark)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;background:#e3e8e0;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,25,18,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:460px;max-height:92vh;border-radius:22px 22px 0 0;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;gap:8px;z-index:2;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:16px;font-weight:800}
.sheet-h .x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#e3e8e0;display:grid;place-items:center;font-size:18px}
.sheet-b{padding:16px 18px 28px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#3c4a42}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:14px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--court-2);box-shadow:0 0 0 3px rgba(31,115,84,.12)}
.f textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sets-in{display:grid;grid-template-columns:54px 1fr 18px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.sets-in span{font-size:12px;color:var(--muted)}
.sets-in input{text-align:center;padding:10px 4px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
.stepper button{width:34px;height:40px;font-size:18px;color:var(--court)}
.stepper input{border:none!important;text-align:center;padding:0!important;box-shadow:none!important;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px}
.pills button.on{background:var(--court);color:#fff;border-color:var(--court)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.mini-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.mini-stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center}
.mini-stats b{display:block;font-size:17px}
.mini-stats span{font-size:10.5px;color:var(--muted)}
/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{font-size:24px;display:block;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
.stat em{font-style:normal;font-size:11px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#e6ebe3;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.surf-row{display:grid;grid-template-columns:60px 1fr 70px;align-items:center;gap:10px;font-size:13px;margin:8px 0}
.form-strip{display:flex;gap:5px;flex-wrap:wrap}
.form-strip span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;font-family:'Archivo'}
.form-strip .W{background:#e2f3ea;color:var(--win)}.form-strip .L{background:#fbe6e3;color:var(--loss)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* analysis */
.svc-hero{background:linear-gradient(135deg,#0e3a2a,#17573f 60%,#2b7a58);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.svc-hero h3{font-size:19px;font-weight:900;line-height:1.35;letter-spacing:-.3px}
.svc-hero p{font-size:12.5px;opacity:.85;margin:8px 0 14px;line-height:1.6}
.svc-hero .flow{display:flex;gap:6px;font-size:11px;align-items:center;flex-wrap:wrap}
.svc-hero .flow span{background:rgba(255,255,255,.12);padding:5px 8px;border-radius:8px}
.pkg{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;width:100%;display:block}
.pkg.on{border-color:var(--court);box-shadow:0 0 0 3px rgba(23,87,63,.12)}
.pkg .h{display:flex;align-items:center;gap:8px}
.pkg .h b{font-size:14.5px}
.pkg .h .p{margin-left:auto;font-weight:800;color:var(--court)}
.pkg ul{list-style:none;margin-top:8px;font-size:12.5px;color:#46544c;line-height:1.75}
.pkg ul li:before{content:"✓ ";color:var(--court-2);font-weight:700}
.pkg .tag{font-size:10.5px;background:var(--ball);color:var(--court-dark);padding:2px 7px;border-radius:99px;font-weight:800}
.coach{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.coach.on{border-color:var(--court);box-shadow:0 0 0 3px rgba(23,87,63,.12)}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.coach .t{font-weight:700;font-size:14px}
.coach .s{font-size:12px;color:var(--muted);margin-top:1px}
.coach .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.coach .tags span{font-size:10.5px;background:#eef3ec;color:var(--court);padding:2px 7px;border-radius:6px;font-weight:500}
.sample{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:5px;margin-left:4px;font-weight:500;vertical-align:1px}
.steps{display:flex;margin:6px 0 4px}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--muted);position:relative;padding-top:20px}
.steps div:before{content:"";position:absolute;top:5px;left:50%;width:12px;height:12px;border-radius:50%;background:#d6ddd3;transform:translateX(-50%);z-index:1}
.steps div:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:#d6ddd3}
.steps div:first-child:after{display:none}
.steps div.on{color:var(--court);font-weight:700}
.steps div.on:before,.steps div.on:after{background:var(--court)}
.kv{display:grid;grid-template-columns:86px 1fr;gap:8px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:500}
.report{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.report h4{font-size:13px;margin:12px 0 5px;color:var(--court)}
.report h4:first-child{margin-top:0}
.report p{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sw{width:38px;height:22px;border-radius:99px;background:#cfd6cc;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--court)}.sw.on:after{left:18px}
.analyst-banner{background:#fff3dc;color:#7b5108;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{background:#fff;border-radius:18px;padding:20px;margin:auto 20px;max-width:340px;width:100%;align-self:center}
.confirm p{font-size:14.5px;line-height:1.6;margin-bottom:16px;text-align:center}
.confirm .row button{width:100%}
.scrim.center{align-items:center}
.score-line{font-family:'Archivo';font-weight:700;letter-spacing:.3px}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
/* draw */
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rcard h4{font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rcard h4 .chip{margin-left:auto}
.mrow{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed #e4e9e1}
.rcard h4 + .mrow{border-top:none}
.mrow .ct{font-size:11px;font-weight:800;color:#fff;background:var(--court-2);border-radius:8px;text-align:center;padding:6px 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13.5px}
.vs .tm{font-weight:700;line-height:1.4}
.vs .tm.r{text-align:right}
.vs .tm.win{color:var(--win)}
.vs .mid{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.vs input{width:36px;padding:5px 0;text-align:center;border:1px solid var(--line);border-radius:7px;font-family:'Archivo';font-size:14px;background:#f7f9f5}
.restline{font-size:12px;color:var(--muted);margin-top:4px;padding-top:8px;border-top:1px solid #eef1ea}
.restline b{color:#9a6408;font-weight:700}
.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.metric b{display:block;font-size:20px}
.metric span{font-size:11px;color:var(--muted)}
.metric .good b{color:var(--win)}
.ptable{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ptable th{font-size:11px;color:var(--muted);font-weight:500;padding:8px 4px;background:#f5f7f3;text-align:center}
.ptable td{padding:8px 4px;border-top:1px solid #eef1ea;text-align:center;font-family:'Archivo','Noto Sans KR'}
.ptable td:first-child,.ptable th:first-child{text-align:left;padding-left:12px;font-family:'Noto Sans KR';font-weight:500}
.copybox{width:100%;min-height:160px;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;font-family:ui-monospace,monospace}
.ptag{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;margin:0 3px;vertical-align:1px;font-family:'Noto Sans KR'}
.ptag.F{background:#e3eefb;color:var(--hard)}.ptag.B{background:#fbe9e1;color:var(--clay)}
.poschip{padding:6px 10px!important;font-size:12.5px!important}
.poschip em{font-style:normal;font-size:11px;font-weight:800;margin-left:3px;color:var(--muted)}
.poschip.F{background:#e3eefb!important;border-color:#b9d1f0!important}.poschip.F em{color:var(--hard)}
.poschip.B{background:#fbe9e1!important;border-color:#f0c9b8!important}.poschip.B em{color:var(--clay)}
.metric .bad b{color:var(--loss)}
.seg2{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#e3e8e0;border-radius:12px;padding:3px;width:278px;max-width:100%;box-sizing:border-box}
.seg2 .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#fff;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.seg2.singles .knob{transform:translateX(100%)}
.seg2 button{position:relative;z-index:1;padding:9px 0;font-size:13.5px;color:var(--muted);font-weight:500;transition:color .2s}
.seg2.doubles button[data-v=doubles],.seg2.singles button[data-v=singles]{color:var(--ink);font-weight:700}
.inline2{display:flex;gap:14px}
.inline2 .f{width:132px}
.inline2 .stepper button{width:38px}
.addrow{display:flex;width:278px;max-width:100%;box-sizing:border-box;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 2px;transition:border-color .15s,box-shadow .15s}
.addrow:focus-within{border-color:var(--court-2);box-shadow:0 0 0 3px rgba(31,115,84,.12)}
.f .addrow input{flex:1;width:auto;min-width:0;border:none!important;box-shadow:none!important;padding:8px 10px;background:transparent}
.addrow .btn{padding:0 16px;height:38px;flex:none;border-radius:9px;font-size:13.5px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:20px}
.pchip{display:inline-flex;align-items:center;gap:2px;background:#eef3ec;color:var(--court-dark);border-radius:99px;padding:5px 4px 5px 11px;font-size:13px;font-weight:500;animation:pop .18s ease}
.pchip button{width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;color:#6c7b72;display:grid;place-items:center}
.pchip button:hover{background:#dbe4d8;color:var(--loss)}
@keyframes pop{from{transform:scale(.85);opacity:.3}}
.possum{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
.possum .ptag{margin-left:6px}
.ptag.N{background:#eef1ea;color:var(--muted)}
.poslist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.prow{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 14px;border-top:1px solid #eef1ea}
.prow:first-child{border-top:none}
.prow .pn{font-size:14px;font-weight:500}
.pseg{display:grid;grid-template-columns:repeat(3,46px);background:#eef1ea;border-radius:9px;padding:2px;gap:2px}
.pseg button{padding:6px 0;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.pseg button.on{font-weight:800;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pseg button.on.F{background:#dbe8f8;color:var(--hard)}
.pseg button.on.B{background:#f8e0d5;color:var(--clay)}
.pseg button.on.N{background:#fff;color:var(--ink)}
.pempty{padding:22px 16px;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.intro{font-size:14px;font-weight:500;color:#2e3b34;line-height:1.5}
.app.single main{padding-bottom:40px}
.app.single ~ .toast{bottom:28px}
.stepper input[readonly]{pointer-events:none;user-select:none;-webkit-user-select:none;caret-color:transparent;background:transparent;font-weight:700}
.stepper button:disabled{opacity:.3;cursor:default}
.actrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.actrow .btn{padding:11px 4px;font-size:13px;white-space:nowrap}
.ditem{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ditem .item{border:none;border-radius:0;flex:1;min-width:0}
.delbtn{flex:none;width:52px;display:grid;place-items:center;color:#b6564a;transition:background .15s}
.delbtn:hover,.delbtn:active{background:#fdeceb;color:var(--loss)}
.confirm .btn.danger{background:var(--loss);color:#fff;border-color:var(--loss)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="ball"></span>코트로그<small>CourtLog</small></div>
    <div class="sync loading" id="sync"><i></i><span>연결 중</span></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="scrim center" id="dlg"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = d => { if(!d) return ''; const [y,m,dd] = d.split('-'); const w = '일월화수목금토'[new Date(d+'T00:00').getDay()]; return `${+m}.${+dd} (${w})`; };
const won = n => n.toLocaleString('ko-KR') + '원';
const pct = (a,b) => b ? Math.round(a/b*100) : null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1900); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  coach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 6M18 14c2 .8 3.2 2.9 3.5 6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>',
  draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h5v5H3zM3 14h5v5H3zM8 7.5h3v9H8M11 12h4M15 9.5h6v5h-6z"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="2"/><path d="m6 21 3-6 3 2v4M9 15l1.5-5 4 1.5 3 3.5M10.5 10 7 11l-1.5 3"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
};

/* ---------- static catalog (sample) ---------- */
const PACKAGES = [
  { id:'basic', name:'현장 스탯 기록', price:60000, tag:'입문',
    items:['분석가가 경기 현장에 동행','포인트별 스탯 실시간 기록','경기 직후 스탯 요약 전달'] },
  { id:'video', name:'영상 + 전술 리포트', price:120000, tag:'인기',
    items:['현장 동행 + 경기 전체 촬영','서브·리턴·랠리 패턴 분석','강점/개선점 리포트 (3일 내)'] },
  { id:'pro', name:'분석 + 피드백 레슨', price:180000, tag:'추천',
    items:['영상 + 전술 리포트 포함','리포트 기반 1:1 피드백 레슨 60분','다음 경기 목표 & 훈련 플랜'] }
];
const COACHES = [
  { id:'c1', name:'김도윤', initial:'도', color:'#17573f', title:'전 실업팀 선수 · 분석 경력 7년', area:'서울 강남·서초', tags:['단식 전술','서브 분석'] },
  { id:'c2', name:'박서연', initial:'서', color:'#c4623a', title:'생활체육지도자 · 영상 분석', area:'서울 마포·영등포', tags:['복식 포지셔닝','풋워크'] },
  { id:'c3', name:'이준호', initial:'준', color:'#2f6db5', title:'주니어 코치 · 데이터 기록', area:'경기 성남·용인', tags:['포인트 패턴','멘탈 루틴'] },
  { id:'c4', name:'최유진', initial:'유', color:'#7a5bb5', title:'전 대학 선수 · 클레이 전문', area:'인천·부천', tags:['클레이 코트','랠리 지구력'] }
];
const SURFACES = ['하드','클레이','인조잔디','실내'];
const FOCUS = ['서브','리턴','포핸드','백핸드','발리','스매시','풋워크','체력','게임 연습'];
const STATUS = { requested:'요청됨', confirmed:'확정', done:'리포트 완료', canceled:'취소됨' };

/* ---------- data layer ---------- */
const Data = {
  mode:'loading', col:null, list:[], loaded:false,
  async init(){
    const local = () => { this.mode = 'local'; this.list = lsGet('courtlog_records', []); this.loaded = true; setSync(); render(); };
    try{
      if(!window.claude || !window.claude.use){ local(); return; }
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user){ local(); return; }
      const uid = await user.id();
      if(!uid){ local(); return; }
      let canWrite = null; try { canWrite = user.can ? await user.can('data.write') : null; } catch(e){}
      if(canWrite === false){ local(); return; }
      this.col = db.collection('data/users/' + uid);
      const timer = setTimeout(() => { if(!this.loaded){ this.mode = 'slow'; setSync(); } }, 10000);
      this.col.onSnapshot(snap => {
        this.list = snap.docs.map(d => ({ ...d.data(), id:d.id }));
        if(!snap.metadata.fromCache){ clearTimeout(timer); this.loaded = true; this.mode = 'cloud'; }
        else if(!this.loaded){ this.loaded = true; }
        setSync(); render();
      }, err => { clearTimeout(timer); console.warn('db', err); if(!this.loaded){ local(); } else { this.mode='local'; setSync(); } });
    } catch(e){ console.warn(e); local(); }
  },
  async save(rec){
    if(!rec.id) rec.id = newId();
    rec.updatedAt = Date.now();
    if(!rec.createdAt) rec.createdAt = rec.updatedAt;
    if(this.col && this.mode !== 'local'){
      const { id, ...body } = rec;
      try { await this.col.doc(id).set(JSON.parse(JSON.stringify(body))); }
      catch(e){
        if(e && e.code === 'quota_exceeded'){ toast('저장 공간이 가득 찼어요. 오래된 기록을 정리해 주세요.'); throw e; }
        if(e && e.code === 'unavailable'){ await new Promise(r=>setTimeout(r, 600+Math.random()*600)); const { id:_i, ...b2 } = rec; return this.col.doc(id).set(JSON.parse(JSON.stringify(b2))); }
        if(e && e.code === 'invalid_argument'){ // 이 보기 권한으로는 클라우드 저장 불가 → 이 기기 저장으로 전환
          this.mode = 'local'; this.col = null; const keep = this.list.filter(r => r.id !== rec.id); keep.push(rec); this.list = keep;
          lsSet('courtlog_records', this.list); setSync(); render(); toast('이 기기에 저장했어요'); return rec;
        }
        toast('저장하지 못했어요 (' + (e.code||'오류') + ')'); throw e;
      }
    } else {
      const i = this.list.findIndex(r => r.id === rec.id);
      if(i >= 0) this.list[i] = rec; else this.list.push(rec);
      lsSet('courtlog_records', this.list); render();
    }
    return rec;
  },
  async remove(id){
    if(this.col && this.mode !== 'local'){ await this.col.doc(id).delete(); }
    else { this.list = this.list.filter(r => r.id !== id); lsSet('courtlog_records', this.list); render(); }
  },
  get(id){ return this.list.find(r => r.id === id); },
  matches(){ return this.list.filter(r => r.kind==='match').sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt); },
  practices(){ return this.list.filter(r => r.kind==='practice').sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt); },
  bookings(){ return this.list.filter(r => r.kind==='booking').sort((a,b)=> (a.date||'').localeCompare(b.date||'')); }
};
function setSync(){
  const el = $('#sync'), m = Data.mode;
  el.className = 'sync ' + (m==='cloud'?'cloud':m==='local'?'local':'loading');
  el.querySelector('span').textContent = m==='cloud' ? '클라우드 저장' : m==='local' ? '이 기기에 저장' : m==='slow' ? '연결 지연' : '연결 중';
}

/* ---------- state ---------- */
/* 사용할 탭 설정: 나중에 다른 탭을 다시 켜려면 아래 목록에 추가하세요.
   가능한 값: 'home'(홈), 'list'(기록), 'draw'(대진표), 'coach'(현장분석), 'chart'(통계) */
const ENABLED_TABS = ['draw'];
const UI = { tab:ENABLED_TABS[0], recFilter:'all', analyst:false };

/* ---------- helpers ---------- */
function setsText(sets){
  return (sets||[]).map(s => s.stb ? `[${s.stb[0]}-${s.stb[1]}]` : `${s.a}-${s.b}${s.tb ? `(${Math.min(s.tb[0],s.tb[1])})` : ''}`).join(' ');
}
function calcResult(sets){
  let a=0,b=0; (sets||[]).forEach(s => { if(s.a>s.b) a++; else if(s.b>s.a) b++; });
  return a>b ? 'W' : b>a ? 'L' : null;
}
function summary(){
  const ms = Data.matches(), ps = Data.practices();
  const w = ms.filter(m=>m.result==='W').length;
  const ym = today().slice(0,7);
  const monthMatches = ms.filter(m => (m.date||'').startsWith(ym)).length;
  const since = new Date(); since.setDate(since.getDate()-30); const s30 = since.toISOString().slice(0,10);
  const pracMin = ps.filter(p => p.date >= s30).reduce((t,p)=>t+(+p.minutes||0),0);
  return { total:ms.length, w, l:ms.length-w, rate:pct(w, ms.length), monthMatches, pracMin };
}
function matchItem(m){
  const opp = m.type==='복식' ? `${esc(m.opponent||'상대')}` : esc(m.opponent||'상대');
  return `<button class="item" data-open="${m.id}">
    <div class="badge ${m.result||'W'}">${m.result==='W'?'승':m.result==='L'?'패':'-'}</div>
    <div class="grow"><div class="t">vs ${opp}</div><div class="s">${fmtDate(m.date)} · ${esc(m.type||'단식')} · ${esc(m.surface||'')}${m.venue?' · '+esc(m.venue):''}</div></div>
    <div class="r score-line">${esc(setsText(m.sets))}</div></button>`;
}
function practiceItem(p){
  return `<button class="item" data-open="${p.id}">
    <div class="badge P">연습</div>
    <div class="grow"><div class="t">${esc((p.focus||[]).join(' · ') || '연습')}</div><div class="s">${fmtDate(p.date)}${p.venue?' · '+esc(p.venue):''}${p.memo?' · '+esc(p.memo):''}</div></div>
    <div class="r num"><b>${+p.minutes||0}</b>분</div></button>`;
}
function bookingItem(b){
  const c = COACHES.find(c=>c.id===b.coachId) || {}; const p = PACKAGES.find(p=>p.id===b.pkg) || {};
  return `<button class="item" data-open="${b.id}">
    <div class="badge B">분석</div>
    <div class="grow"><div class="t">${esc(p.name||'현장 분석')}</div><div class="s">${fmtDate(b.date)} ${esc(b.time||'')} · ${esc(c.name||'')} 분석가 · ${esc(b.venue||'')}</div></div>
    <div class="r"><span class="chip ${b.status}">${STATUS[b.status]||''}</span></div></button>`;
}
function emptyBox(text, btnLabel, action){
  return `<div class="empty">${text}${btnLabel?`<br><button class="btn ghost" data-act="${action}">${btnLabel}</button>`:''}</div>`;
}

/* ---------- render ---------- */
const TABS = [['home','홈'],['list','기록'],['draw','대진표'],['coach','현장분석'],['chart','통계']];
function renderTabs(){
  const tabs = TABS.filter(([k]) => ENABLED_TABS.includes(k));
  const single = tabs.length < 2;
  $('#tabs').style.display = single ? 'none' : '';
  document.querySelector('.app').classList.toggle('single', single);
  $('#tabs').style.gridTemplateColumns = `repeat(${tabs.length},1fr)`;
  $('#tabs').innerHTML = tabs.map(([k,l]) => `<button data-tab="${k}" class="${UI.tab===k?'on':''}"><span>${ICON[k]}</span>${l}</button>`).join('');
}
function render(){
  renderTabs();
  $('#sync').style.display = UI.tab==='draw' ? 'none' : '';
  const v = $('#view');
  if(!Data.loaded){ v.innerHTML = `<div class="empty">기록을 불러오는 중이에요…</div>`; return; }
  const af = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.sc : null;
  v.innerHTML = ({home:viewHome, list:viewList, draw:viewDraw, coach:viewCoach, chart:viewStats})[UI.tab]();
  if(UI.tab==='draw') bindDraw();
  if(af){ const el = v.querySelector(`[data-sc="${af}"]`); if(el){ el.focus(); try{ el.select(); }catch(e){} } }
}

function viewHome(){
  const s = summary();
  const next = Data.bookings().filter(b => (b.status==='requested'||b.status==='confirmed') && b.date >= today())[0];
  const recent = [...Data.matches().slice(0,3).map(m=>({d:m.date,c:m.createdAt,h:matchItem(m)})), ...Data.practices().slice(0,3).map(p=>({d:p.date,c:p.createdAt,h:practiceItem(p)}))]
    .sort((a,b)=> (b.d||'').localeCompare(a.d||'') || b.c-a.c).slice(0,4);
  return `
  <div class="card hero">
    <div class="kick">${fmtDate(today())} · 나의 테니스</div>
    <div class="big">${s.total ? `통산 ${s.w}승 ${s.l}패` : '첫 경기를 기록해 보세요'}</div>
    <div class="kpis">
      <div class="kpi"><b class="num">${s.rate ?? '–'}${s.rate!=null?'<small style="font-size:13px">%</small>':''}</b><span>승률</span></div>
      <div class="kpi"><b class="num">${s.monthMatches}</b><span>이번 달 경기</span></div>
      <div class="kpi"><b class="num">${Math.round(s.pracMin/6)/10}</b><span>최근 30일 연습(시간)</span></div>
    </div>
  </div>
  <div class="quick">
    <button data-act="newMatch"><span class="ic">${ICON.plus}</span>경기 기록</button>
    <button data-act="newPractice"><span class="ic">${ICON.run}</span>연습 기록</button>
    <button data-tab="draw"><span class="ic">${ICON.draw}</span>대진표 만들기</button>
    <button data-act="newBooking"><span class="ic">${ICON.cal}</span>분석 예약</button>
  </div>
  <h2 class="sec">다가오는 현장 분석 <button data-tab="coach">전체</button></h2>
  ${next ? `<div class="list">${bookingItem(next)}</div>` : emptyBox('예정된 분석이 없어요.<br>중요한 경기에 분석가가 동행해 기록하고 리포트를 드려요.','분석가 동행 예약하기','newBooking')}
  <h2 class="sec">최근 활동 <button data-tab="list">전체 보기</button></h2>
  ${recent.length ? `<div class="list">${recent.map(r=>r.h).join('')}</div>` : emptyBox('아직 기록이 없어요.','경기 기록 추가','newMatch')}
  `;
}

function viewList(){
  const f = UI.recFilter;
  let items = [];
  if(f!=='practice') items.push(...Data.matches().map(m=>({d:m.date,c:m.createdAt,h:matchItem(m)})));
  if(f!=='match') items.push(...Data.practices().map(p=>({d:p.date,c:p.createdAt,h:practiceItem(p)})));
  items.sort((a,b)=> (b.d||'').localeCompare(a.d||'') || b.c-a.c);
  // group by month
  let html = '', cur = '';
  items.forEach(it => { const m = (it.d||'').slice(0,7); if(m!==cur){ cur=m; const [y,mm]=m.split('-'); html += `<h2 class="sec">${y}년 ${+mm}월</h2>`; } html += it.h; });
  return `
  <div class="seg">${[['all','전체'],['match','경기'],['practice','연습']].map(([k,l])=>`<button data-filter="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="newMatch">${ICON.plus.replace('<svg','<svg width="16" height="16"')} 경기</button><button class="btn ghost" data-act="newPractice">${ICON.plus.replace('<svg','<svg width="16" height="16"')} 연습</button></div>
  <div class="list">${html || '<div style="margin-top:14px">'+emptyBox('기록이 없어요. 경기나 연습을 추가해 보세요.')+'</div>'}</div>`;
}

/* ---------- stats ---------- */
function viewStats(){
  const ms = Data.matches();
  if(!ms.length) return `<h2 class="sec">통계</h2>${emptyBox('경기 기록이 쌓이면 승률, 표면별 성적, 서브·실수 추이를 보여 드려요.','경기 기록 추가','newMatch')}`;
  const s = summary();
  const withStats = ms.filter(m => m.stats);
  const avg = k => withStats.length ? (withStats.reduce((t,m)=>t+(+m.stats[k]||0),0)/withStats.length) : null;
  const fsIn = withStats.reduce((t,m)=>t+(+m.stats.fsIn||0),0), fsTot = withStats.reduce((t,m)=>t+(+m.stats.fsTotal||0),0);
  const form = ms.slice(0,10);
  const bySurf = SURFACES.map(su => { const x = ms.filter(m=>m.surface===su); const w = x.filter(m=>m.result==='W').length; return {su, n:x.length, w}; }).filter(x=>x.n);
  const byType = ['단식','복식'].map(t => { const x = ms.filter(m=>(m.type||'단식')===t); const w = x.filter(m=>m.result==='W').length; return {t, n:x.length, w}; }).filter(x=>x.n);
  // chart: winners vs UE, last 8 with stats (oldest→newest)
  const ch = withStats.slice(0,8).reverse();
  let chart = '';
  if(ch.length){
    const W = 400, H = 170, pad = 24, bw = Math.min(56, (W - pad*2) / ch.length);
    const max = Math.max(5, ...ch.map(m=>Math.max(+m.stats.winners||0, +m.stats.ue||0)));
    const y = v => H - 22 - (v/max)*(H-40);
    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 경기 위너와 실수 비교">
      ${[0, Math.round(max/2), max].map(v=>`<line x1="${pad}" x2="${W-pad}" y1="${y(v)}" y2="${y(v)}" stroke="#e6ebe3"/><text x="${pad-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#8a968f">${v}</text>`).join('')}
      ${ch.map((m,i)=>{ const x = pad + i*bw + bw*0.18, b = bw*0.3; const w=+m.stats.winners||0, u=+m.stats.ue||0;
        return `<rect x="${x}" y="${y(w)}" width="${b}" height="${H-22-y(w)}" rx="3" fill="#1f7354"><title>위너 ${w}</title></rect>
        <rect x="${x+b+2}" y="${y(u)}" width="${b}" height="${H-22-y(u)}" rx="3" fill="#e08a7d"><title>실수 ${u}</title></rect>
        <text x="${x+b+1}" y="${H-7}" font-size="10" text-anchor="middle" fill="${m.result==='W'?'#1f8a5b':'#c94a3c'}" font-weight="700">${m.result==='W'?'승':'패'}</text>`; }).join('')}
    </svg>`;
  }
  return `
  <h2 class="sec">전체 성적</h2>
  <div class="statgrid">
    <div class="stat"><span>승률</span><b class="num">${s.rate}%</b><em>${s.w}승 ${s.l}패 · ${s.total}경기</em></div>
    <div class="stat"><span>1st 서브 성공률</span><b class="num">${fsTot? pct(fsIn,fsTot)+'%':'–'}</b><em>${fsTot? `${fsIn}/${fsTot} 포인트`:'세부 스탯 입력 시 집계'}</em></div>
    <div class="stat"><span>경기당 위너</span><b class="num">${avg('winners')!=null? avg('winners').toFixed(1):'–'}</b><em>에이스 경기당 ${avg("aces")!=null?avg("aces").toFixed(1):"–"}개</em></div>
    <div class="stat"><span>경기당 실수</span><b class="num">${avg('ue')!=null? avg('ue').toFixed(1):'–'}</b><em>더블폴트 ${avg('dfs')!=null?avg('dfs').toFixed(1):'–'}개</em></div>
  </div>
  <h2 class="sec">최근 폼 <span class="hint">최신 → 과거</span></h2>
  <div class="card"><div class="form-strip">${form.map(m=>`<span class="${m.result}">${m.result==='W'?'승':'패'}</span>`).join('')}</div></div>
  ${ch.length ? `<h2 class="sec">위너 vs 실수 (최근 ${ch.length}경기)</h2><div class="card">${chart}<div class="legend"><span><i style="background:#1f7354"></i>위너</span><span><i style="background:#e08a7d"></i>범실(UE)</span></div></div>`:''}
  <h2 class="sec">코트 표면별</h2>
  <div class="card">${bySurf.map(x=>`<div class="surf-row"><b>${x.su}</b><div class="bar"><i style="width:${pct(x.w,x.n)}%;background:var(--win)"></i><i style="width:${100-pct(x.w,x.n)}%;background:#efb4ab"></i></div><span class="num" style="text-align:right">${x.w}승 ${x.n-x.w}패</span></div>`).join('')}</div>
  <h2 class="sec">단식 / 복식</h2>
  <div class="card">${byType.map(x=>`<div class="surf-row"><b>${x.t}</b><div class="bar"><i style="width:${pct(x.w,x.n)}%;background:var(--win)"></i><i style="width:${100-pct(x.w,x.n)}%;background:#efb4ab"></i></div><span class="num" style="text-align:right">${pct(x.w,x.n)}%</span></div>`).join('')}</div>
  `;
}

/* ---------- sheets ---------- */
function openSheet(title, body, onMount){
  $('#sheet').innerHTML = `<div class="sheet-h"><h3>${title}</h3><button class="x" data-close>×</button></div><div class="sheet-b">${body}</div>`;
  $('#scrim').classList.add('open');
  $('#sheet').scrollTop = 0;
  onMount && onMount($('#sheet'));
}
function closeSheet(){ $('#scrim').classList.remove('open'); }
function ask(msg, okLabel, danger){
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="confirm"><p>${msg}</p><div class="row"><button class="btn ghost" data-a="0">취소</button><button class="btn ${danger?'danger':''}" data-a="1">${okLabel}</button></div></div>`;
    d.classList.add('open');
    d.onclick = e => { const b = e.target.closest('[data-a]'); if(b || e.target===d){ d.classList.remove('open'); res(b && b.dataset.a==='1'); } };
  });
}
function num(v){ const n = parseInt(v,10); return isNaN(n) ? 0 : Math.max(0,n); }
function stepper(name, val){ return `<div class="stepper"><button type="button" data-step="-1">−</button><input class="num" name="${name}" type="number" min="0" inputmode="numeric" value="${val??0}"><button type="button" data-step="1">+</button></div>`; }
function bindSteppers(root){
  root.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const i = b.parentNode.querySelector('input'); i.value = Math.max(0, num(i.value) + +b.dataset.step); });
}
function pillsBind(root, sel, multi){
  root.querySelectorAll(sel+' button').forEach(b => b.onclick = () => {
    if(!multi) root.querySelectorAll(sel+' button').forEach(x=>x.classList.remove('on'));
    b.classList.toggle('on', multi ? !b.classList.contains('on') : true);
  });
}
const pillVals = (root, sel) => [...root.querySelectorAll(sel+' button.on')].map(b=>b.dataset.v);

function matchForm(m){

      <div class="row3" style="margin-top:10px">
        <div class="f"><label>에이스</label>${stepper('aces',st.aces)}</div>
        <div class="f"><label>더블폴트</label>${stepper('dfs',st.dfs)}</div>
        <div class="f"><label>위너</label>${stepper('winners',st.winners)}</div>
        <div class="f"><label>범실(UE)</label>${stepper('ue',st.ue)}</div>
        <div class="f"><label>1st 서브 성공</label>${stepper('fsIn',st.fsIn)}</div>
        <div class="f"><label>1st 서브 시도</label>${stepper('fsTotal',st.fsTotal)}</div>
      </div>
    </details>
    <div class="f"><label>메모 · 느낀 점</label><textarea name="memo" placeholder="잘된 점, 아쉬운 점, 상대 특징 등">${esc(m.memo||'')}</textarea></div>
    <button class="btn block" type="submit">저장</button>
  </form>`, root => {
    pillsBind(root, '#pType');
    root.querySelectorAll('#pType button').forEach(b => b.addEventListener('click', () => { root.querySelector('#partnerF').style.display = b.dataset.v==='복식' ? '' : 'none'; }));
    bindSteppers(root);
    root.querySelector('#mf').onsubmit = async e => {
      e.preventDefault(); const f = e.target;
      const sets = [];
      for(let i=0;i<3;i++){ const a=f['s'+i+'a'].value, b=f['s'+i+'b'].value; if(a!==''&&b!==''){ const prev = (m.sets||[])[i]; const set = {a:num(a), b:num(b)}; if(prev && prev.tb && ((set.a===7&&set.b===6)||(set.a===6&&set.b===7))) set.tb = prev.tb; if(prev && prev.stb && prev.stb[0]===set.a && prev.stb[1]===set.b) { sets.push(prev); continue; } sets.push(set); } }
      const ov = f.resultOverride.value;
      const result = ov || calcResult(sets);
      if(!result){ toast('세트 스코어를 입력하거나 결과를 선택해 주세요'); return; }
      const statKeys = ['aces','dfs','winners','ue','fsIn','fsTotal'];

      const rec = { ...m, kind:'match', date:f.date.value, type:pillVals(root,'#pType')[0]||'단식', opponent:f.opponent.value.trim(), partner:f.partner.value.trim(),

      try { await Data.save(rec); closeSheet(); toast('경기를 저장했어요'); } catch(e){}
    };
  });
}

  const linked = Data.bookings().filter(b => b.matchId===m.id && b.report);
  openSheet(`vs ${esc(m.opponent||'상대')}`, `
    <div class="card" style="display:flex;align-items:center;gap:14px">

const SAMPLE_NAMES = ['김민준','이서연','박도윤','최지우','정하준','강서윤','조시우','윤하은','장지호','임수아','한예준','오지민','서건우','신채원','권유찬','황다은','안준서','송예린','전태윤','홍나연'];
const SAMPLE_POS = ['포','백','포','백','포','백','포','백','포','백','포','백','','',''];
const sampleText = () => SAMPLE_NAMES.slice(0,15).map((x,i)=> SAMPLE_POS[i] ? `${x} ${SAMPLE_POS[i]}` : x).join('\n');

const POS_RE = /^(.+?)\s*[\s(\[\/:\-]\s*(포|백|무관|F|B)\s*[\)\]]?$/i;
function parsePlayers(txt){
  const seen = new Set(), out = [];
  String(txt||'').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean).forEach(x => {
    let name = x, pos = null; const m = x.match(POS_RE);
    if(m){ name = m[1].trim(); const t = m[2].toUpperCase(); pos = (t==='포'||t==='F') ? 'F' : (t==='백'||t==='B') ? 'B' : null; }
    if(!name) return;
    let n = name, k = 2; while(seen.has(n)) n = name + k++; seen.add(n); out.push({ name:n, pos });
  });
  return out;
}
const parseNames = txt => parsePlayers(txt).map(p=>p.name);
const POS_LABEL = { F:'포', B:'백' };
const posTag = p => p ? `<span class="ptag ${p}">${POS_LABEL[p]}</span>` : '';
function playersToText(list){ return list.map(p => p.pos ? `${p.name} ${POS_LABEL[p.pos]}` : p.name).join('\n'); }
function drawShape(n, courts, doubles){
  const per = doubles ? 4 : 2; const M = Math.min(courts, Math.floor(n/per));
  return { per, M, slots: M*per, rest: n - M*per };
}
function equalRounds(n, slots, max){ const r = []; for(let R=1; R<=max; R++) if((R*slots) % n === 0) r.push(R); return r; }

function genSchedule(n, courts, rounds, doubles, pos){
  pos = pos || [];
  const bad = (a,b) => !!(pos[a] && pos[a]===pos[b]);
  const W_POS = 1000;
  const posFeasible = pos.filter(x=>x==='F').length <= n/2 && pos.filter(x=>x==='B').length <= n/2;
  const { per, M } = drawShape(n, courts, doubles);
  if(M < 1) return null;
  const K = (a,b) => a<b ? a*512+b : b*512+a;
  const W_MET = 4, W_PART = 7;            // 같은 코트 재회 / 같은 편 재회 가중치
  const t0 = performance.now();
  let best = null, tries = 0;
  const roundCost = (arr, met, part) => {
    let c = 0;
    for(let g=0; g<M; g++){
      const q = arr.slice(g*per, g*per+per);
      for(let i=0;i<per;i++) for(let j=i+1;j<per;j++){ const m = met[K(q[i],q[j])]||0; c += W_MET * m * (m+1); }
      if(per===4){ const p1 = part[K(q[0],q[1])]||0, p2 = part[K(q[2],q[3])]||0; c += W_PART * (p1*(p1+1) + p2*(p2+1)); if(bad(q[0],q[1])) c += W_POS; if(bad(q[2],q[3])) c += W_POS; }
    }
    return c;
  };
  const optimize = (players, met, part) => {
    let bestArr = null, bestC = Infinity;
    const L = players.length;
    for(let s=0; s<14; s++){
      const arr = players.slice(); for(let i=L-1;i>0;i--){ const j = Math.random()*(i+1)|0; [arr[i],arr[j]]=[arr[j],arr[i]]; }
      let c = roundCost(arr, met, part), improved = true;
      while(improved){
        improved = false;
        for(let i=0;i<L;i++) for(let j=i+1;j<L;j++){
          const gi = i/per|0, gj = j/per|0;
          if(gi===gj && (per===2 || ((i%per<2) === (j%per<2)))) continue; // 같은 편끼리 교환은 의미 없음
          [arr[i],arr[j]]=[arr[j],arr[i]];
          const nc = roundCost(arr, met, part);
          if(nc < c){ c = nc; improved = true; } else { [arr[i],arr[j]]=[arr[j],arr[i]]; }
        }
      }
      if(c < bestC){ bestC = c; bestArr = arr.slice(); }
      if(bestC === 0) break;
    }
    return { arr:bestArr, cost:bestC };
  };
  while(tries < 2000 && (performance.now() - t0 < 700 || !best) && !(best && best.score===0)){
    tries++;
    const games = Array(n).fill(0), rested = Array(n).fill(0), lastRest = Array(n).fill(-9);
    const met = {}, part = {}; let total = 0; const out = [];
    for(let r=0; r<rounds; r++){
      const order = [...Array(n).keys()].map(i => ({ i, k: games[i] + (lastRest[i]===r-1 ? -0.6 : 0) + Math.random()*0.5 })).sort((a,b)=>a.k-b.k);
      const play = order.slice(0, M*per).map(o=>o.i), rest = order.slice(M*per).map(o=>o.i);
      if(per===4 && posFeasible){ // 포/백이 팀 수를 넘지 않도록 출전자 보정
        const T = 2*M;
        for(const P of ['F','B']){
          let guard = 0;
          while(play.filter(i=>pos[i]===P).length > T && guard++ < 50){
            let pi = -1; for(let x=play.length-1;x>=0;x--) if(pos[play[x]]===P){ pi = x; break; }
            const ri = rest.findIndex(i => pos[i]!==P);
            if(pi<0 || ri<0) break;
            [play[pi], rest[ri]] = [rest[ri], play[pi]];
          }
        }
      }
      rest.forEach(i => { lastRest[i] = r; rested[i]++; });
      const { arr, cost } = optimize(play, met, part);
      total += cost;
      const matches = [];
      for(let g=0; g<M; g++){
        const q = arr.slice(g*per, g*per+per);
        for(let i=0;i<per;i++) for(let j=i+1;j<per;j++){ const k = K(q[i],q[j]); met[k] = (met[k]||0)+1; }
        if(per===4){ part[K(q[0],q[1])] = (part[K(q[0],q[1])]||0)+1; part[K(q[2],q[3])] = (part[K(q[2],q[3])]||0)+1; }
        q.forEach(i => games[i]++);
        matches.push({ court:g+1, t1: per===4 ? [q[0],q[1]] : [q[0]], t2: per===4 ? [q[2],q[3]] : [q[1]], s1:null, s2:null });
      }
      out.push({ matches, rest });
    }
    const spread = Math.max(...games) - Math.min(...games);
    const score = spread*1e6 + total;
    if(!best || score < best.score) best = { score, rounds:out };
  }
  // 2단계: 상위 후보를 전체 일정 단위로 다듬기
  let fin = best.rounds, finCost = best.score;
  for(let k=0; k<8 && finCost>0 && performance.now()-t0 < 4500; k++){
    const res = refineSchedule(n, k%2 ? JSON.parse(JSON.stringify(fin)) : best.rounds, per, 700, pos);
    if(res.cost < finCost){ finCost = res.cost; fin = res.rounds; }
  }
  return orientTeams(fin, pos);
}
function orientTeams(rounds, pos){
  // 팀마다 포(오른쪽)·백(왼쪽)을 확정: 지정된 포지션 우선, 무관은 포/백을 번갈아 고르게 배정
  const rank = (i, mate) => pos[i]==='F' ? 0 : pos[i]==='B' ? 2 : (pos[mate]==='F' ? 2 : pos[mate]==='B' ? 0 : 1);
  const fc = {}, bc = {};
  rounds.forEach(r => r.matches.forEach(m => [m.t1, m.t2].forEach(t => {
    if(t.length !== 2) return;
    const [a,b] = t, ra = rank(a,b), rb = rank(b,a);
    if(ra > rb) t.reverse();
    else if(ra === rb){ const da = (fc[a]||0)-(bc[a]||0), db = (fc[b]||0)-(bc[b]||0); if(db < da || (db === da && Math.random() < 0.5)) t.reverse(); }
    fc[t[0]] = (fc[t[0]]||0)+1; bc[t[1]] = (bc[t[1]]||0)+1;

}
function refineSchedule(n, rounds, per, budgetMs, pos){

  const R = rounds.map(r => ({ slots: r.matches.flatMap(m => [...m.t1, ...m.t2]), rest: r.rest.slice() }));

  while(best > 0 && it < iterMax && performance.now() - t0 < budgetMs){
    it++;
    const T = T0 * Math.pow(0.0005, it/iterMax);
    const r = R[Math.random()*R.length|0];
    let undo;
    if(r.rest.length && Math.random() < 0.35){
      const si = Math.random()*r.slots.length|0, ki = Math.random()*r.rest.length|0;
      const x = r.slots[si], y = r.rest[ki];
      const cands = R.filter(o => o!==r && o.rest.includes(x) && o.slots.includes(y));
      if(!cands.length) continue;
      const o = cands[Math.random()*cands.length|0];
      const oi = o.slots.indexOf(y), ok = o.rest.indexOf(x);
      r.slots[si] = y; r.rest[ki] = x; o.slots[oi] = x; o.rest[ok] = y;
      undo = () => { r.slots[si] = x; r.rest[ki] = y; o.slots[oi] = y; o.rest[ok] = x; };
    } else {
      const L = r.slots.length, i = Math.random()*L|0, j = Math.random()*L|0;
      if(i===j || ((i/per|0)===(j/per|0) && (per===2 || ((i%per<2)===(j%per<2))))) continue;
      [r.slots[i], r.slots[j]] = [r.slots[j], r.slots[i]];
      undo = () => { [r.slots[i], r.slots[j]] = [r.slots[j], r.slots[i]]; };
    }
    const nc = cost(), dl = nc - cur;
    if(dl <= 0 || Math.random() < Math.exp(-dl/T)){ cur = nc; if(cur < best){ best = cur; bestR = JSON.stringify(R); } }
    else undo();
  }
  const F = JSON.parse(bestR);
  return { cost: best, rounds: F.map(r => {
    const matches = [];
    for(let g=0; g<M; g++){ const q = r.slots.slice(g*per, g*per+per); matches.push({ court:g+1, t1: per===4?[q[0],q[1]]:[q[0]], t2: per===4?[q[2],q[3]]:[q[1]], s1:null, s2:null }); }
    return { matches, rest: r.rest };
  }) };
}


function drawMetrics(d){
  const n = d.players.length, K = (a,b) => a<b ? a*512+b : b*512+a;
  const games = Array(n).fill(0), rests = Array(n).fill(0), met = {}, part = {};
  const partners = Array.from({length:n}, () => new Set()), meets = Array.from({length:n}, () => new Set());
  d.rounds.forEach(r => {
    r.rest.forEach(i => rests[i]++);
    r.matches.forEach(m => {
      const q = [...m.t1, ...m.t2];
      q.forEach(i => { games[i]++; q.forEach(j => { if(i!==j) meets[i].add(j); }); });
      for(let i=0;i<q.length;i++) for(let j=i+1;j<q.length;j++){ const k = K(q[i],q[j]); met[k] = (met[k]||0)+1; }
      [m.t1, m.t2].forEach(t => { if(t.length===2){ const k = K(t[0],t[1]); part[k] = (part[k]||0)+1; partners[t[0]].add(t[1]); partners[t[1]].add(t[0]); } });
    });
  });
  const P_ = d.positions || [];
  let posBad = 0; const sideF = Array(n).fill(0), sideB = Array(n).fill(0);
  if(d.mode==='doubles') d.rounds.forEach(r => r.matches.forEach(m => [m.t1, m.t2].forEach(t => { if(t.length===2){ if(P_[t[0]] && P_[t[0]]===P_[t[1]]) posBad++; sideF[t[0]]++; sideB[t[1]]++; } })));
  const repeatPart = Object.values(part).reduce((t,v)=>t+Math.max(0,v-1),0);
  const repeatMet = Object.values(met).reduce((t,v)=>t+Math.max(0,v-1),0);
  const maxMet = Math.max(0, ...Object.values(met));
  const repPerPlayer = Array(n).fill(0);
  Object.entries(met).forEach(([k,v]) => { if(v>1){ const a = Math.floor(k/512), b = k%512; repPerPlayer[a]+=v-1; repPerPlayer[b]+=v-1; } });
  // standings
  const W = Array(n).fill(0), L = Array(n).fill(0), GF = Array(n).fill(0), GA = Array(n).fill(0);
  let scored = 0, totalM = 0;
  d.rounds.forEach(r => r.matches.forEach(m => { totalM++; if(m.s1==null || m.s2==null) return; scored++;
    m.t1.forEach(i => { GF[i]+=m.s1; GA[i]+=m.s2; if(m.s1>m.s2) W[i]++; else if(m.s1<m.s2) L[i]++; });
    m.t2.forEach(i => { GF[i]+=m.s2; GA[i]+=m.s1; if(m.s2>m.s1) W[i]++; else if(m.s2<m.s1) L[i]++; });
  }));
  return { posBad, sideF, sideB, hasPos: P_.some(Boolean), games, rests, repeatPart, repeatMet, maxMet, partners, meets, repPerPlayer, W, L, GF, GA, scored, totalM,
    minG: Math.min(...games), maxG: Math.max(...games) };
}

function drawText(d){
  const P = d.players, side = (t,k) => d.mode==='doubles' && t.length===2 ? (k===0?'F':'B') : null, nm = t => t.map((i,k)=>P[i] + (side(t,k)?`(${POS_LABEL[side(t,k)]})`:'')).join('·');
  let s = `🎾 ${d.title || '대진표'} (${d.mode==='doubles'?'복식':'단식'} · ${d.players.length}명 · 코트 ${d.courts}면)\n`;
  d.rounds.forEach((r,ri) => {
    s += `\n[${ri+1}라운드]\n`;
    r.matches.forEach(m => { s += `코트${m.court}: ${nm(m.t1)} vs ${nm(m.t2)}${m.s1!=null&&m.s2!=null?`  (${m.s1}:${m.s2})`:''}\n`; });
    if(r.rest.length) s += `휴식: ${r.rest.map(i=>P[i]).join(', ')}\n`;
  });
  return s;
}

function drawBoard(d, saved){
  const S = UI.draw, P = d.players, PS = d.positions || [], m = drawMetrics(d), view = S.view;
  const side = (t,k) => d.mode==='doubles' && t.length===2 ? (k===0?'F':'B') : null;
  const nm = (t, win, right) => `<div class="tm ${right?'r':''} ${win?'win':''}">${t.map((i,k)=> right ? `${posTag(side(t,k))}${esc(P[i])}` : `${esc(P[i])}${posTag(side(t,k))}`).join('<br>')}</div>`;
  const rounds = d.rounds.map((r,ri) => `<div class="rcard"><h4>${ri+1}라운드 ${saved?`<span class="chip ${r.matches.every(x=>x.s1!=null&&x.s2!=null)?'done':''}">${r.matches.filter(x=>x.s1!=null&&x.s2!=null).length}/${r.matches.length} 완료</span>`:''}</h4>
    ${r.matches.map((x,mi) => { const w1 = x.s1!=null&&x.s2!=null&&x.s1>x.s2, w2 = x.s1!=null&&x.s2!=null&&x.s2>x.s1;
      return `<div class="mrow"><div class="ct">코트${x.court}</div><div class="vs">${nm(x.t1,w1,true)}
      <div class="mid">${saved?`<input class="num" type="number" min="0" max="99" inputmode="numeric" data-sc="${ri}-${mi}-1" value="${x.s1??''}">:<input class="num" type="number" min="0" max="99" inputmode="numeric" data-sc="${ri}-${mi}-2" value="${x.s2??''}">`:'vs'}</div>${nm(x.t2,w2)}</div></div>`; }).join('')}
    ${r.rest.length?`<div class="restline">휴식 · <b>${r.rest.map(i=>esc(P[i])).join(', ')}</b></div>`:''}</div>`).join('');
  const dbl = d.mode==='doubles' && m.hasPos;
  const idx = [...P.keys()];
  const players = `<table class="ptable"><tr><th>이름</th><th>경기</th><th>휴식</th>${dbl?'<th>포/백 출전</th>':''}<th>파트너</th><th>만난</th><th>재회</th></tr>
    ${idx.map(i=>`<tr><td>${esc(P[i])}${posTag(PS[i])}</td><td>${m.games[i]}</td><td>${m.rests[i]}</td>${dbl?`<td>${m.sideF[i]}/${m.sideB[i]}</td>`:''}<td>${m.partners[i].size}명</td><td>${m.meets[i].size}명</td><td style="color:${m.repPerPlayer[i]?'var(--warn)':'var(--win)'}">${m.repPerPlayer[i]}</td></tr>`).join('')}</table>
    <p class="hint" style="margin-top:8px">‘만난’은 같은 코트에서 함께 뛴 사람 수(총 ${P.length-1}명 중), ‘재회’는 이미 만났던 사람을 다시 만난 횟수예요.${dbl?' ‘포/백 출전’은 실제로 오른쪽/왼쪽에 선 경기 수예요.':''}</p>`;
  const order = idx.slice().sort((a,b)=> (m.W[b]-m.W[a]) || ((m.GF[b]-m.GA[b])-(m.GF[a]-m.GA[a])) || (m.GF[b]-m.GF[a]));
  const standings = `<table class="ptable"><tr><th>순위 · 이름</th><th>승</th><th>패</th><th>득</th><th>실</th><th>득실</th></tr>
    ${order.map((i,k)=>`<tr><td><b class="num" style="color:var(--court);margin-right:6px">${k+1}</b>${esc(P[i])}</td><td>${m.W[i]}</td><td>${m.L[i]}</td><td>${m.GF[i]}</td><td>${m.GA[i]}</td><td style="font-weight:700;color:${m.GF[i]-m.GA[i]>0?'var(--win)':m.GF[i]-m.GA[i]<0?'var(--loss)':'inherit'}">${m.GF[i]-m.GA[i]>0?'+':''}${m.GF[i]-m.GA[i]}</td></tr>`).join('')}</table>
    <p class="hint" style="margin-top:8px">개인 순위: 승수 → 게임 득실 → 득점 순 · 점수 입력 ${m.scored}/${m.totalM}경기</p>`;
  const copyBox = S.copy ? `<textarea class="copybox" readonly>${esc(drawText(d))}</textarea><p class="hint">자동 복사가 막혀 있으면 위 내용을 길게 눌러 복사하세요.</p>` : '';
  return `
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <button class="btn ghost" style="padding:8px 12px" data-dr="back">← 목록</button>
    <div style="min-width:0"><b style="font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.title||'대진표')}</b></div>
  </div>
  <div class="metric" style="grid-template-columns:repeat(${dbl?4:3},1fr)">
    <div class="${m.minG===m.maxG?'good':''}"><b class="num">${m.minG===m.maxG?m.minG:`${m.minG}~${m.maxG}`}</b><span>1인 경기 수</span></div>
    <div class="${d.mode==='singles'||m.repeatPart===0?'good':''}"><b class="num">${d.mode==='doubles'?m.repeatPart:'–'}</b><span>파트너 중복</span></div>
    <div class="${m.repeatMet===0?'good':''}"><b class="num">${m.repeatMet}</b><span>같은 코트 재회</span></div>
    ${dbl?`<div class="${m.posBad===0?'good':'bad'}"><b class="num">${m.posBad}</b><span>포지션 겹침</span></div>`:''}
  </div>
  ${saved ? '' : `<div class="actrow"><button class="btn ghost" data-dr="copy">📋 복사</button><button class="btn ghost" data-dr="edit">✏️ 수정</button></div>${copyBox}`}
  <div class="seg" style="margin-top:14px">${[['rounds','라운드별'],['players','개인별'],...(saved?[['rank','순위']]:[])].map(([k,l])=>`<button data-dr="view" data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('')}</div>
  <div style="margin-top:12px">${view==='players'?players:view==='rank'&&saved?standings:rounds}</div>
  ${saved ? `<div class="row" style="margin-top:6px"><button class="btn ghost" data-dr="copy">📋 복사</button><button class="btn danger" data-dr="delete" data-id="${d.id}">삭제</button></div>${copyBox}` : `<button class="btn block" style="margin-top:8px;padding:15px" data-dr="save">저장하고 점수 입력</button>`}
  `;
}

function bindDraw(){
  const f = $('#df');
  if(f){
    const S = UI.draw.form;
    const LIM = { courts:[1,20], rounds:[1,30] };
    const sync = () => {
      S.title = f.title.value;
      ['courts','rounds'].forEach(k => { const [lo,hi] = LIM[k]; const v = Math.min(hi, Math.max(lo, num(f[k].value))); S[k] = v; f[k].value = v;
        const st = f[k].closest('.stepper'); st.querySelector('[data-step="-1"]').disabled = v<=lo; st.querySelector('[data-step="1"]').disabled = v>=hi; });
    };
    // 코트 수·라운드 수는 −/+ 버튼으로만 변경
    ['courts','rounds'].forEach(k => { f[k].readOnly = true; f[k].tabIndex = -1; f[k].setAttribute('inputmode','none'); });
    bindSteppers(f);
    f.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', sync));
    f.title.addEventListener('input', sync);
    sync();
    // 경기 방식 (슬라이드 토글)
    const mode = $('#dMode');
    mode.querySelectorAll('button').forEach(b => b.onclick = () => { S.mode = b.dataset.v; mode.className = 'seg2 ' + S.mode; $('#posBox').style.display = S.mode==='doubles' ? '' : 'none'; });
    // 참가자 추가
    const inp = $('#pName');
    const add = () => { const v = inp.value.trim(); if(!v) return; addPeople(v); inp.value = ''; inp.focus(); };
    $('#pAdd').onclick = add;
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); add(); } });
    inp.addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData)?.getData('text') || ''; if(/[\n,，]/.test(t)){ e.preventDefault(); addPeople(t); inp.value = ''; } });
    $('#pChips').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if(!b) return; S.players.splice(+b.dataset.rm, 1); refreshPeople(); });
    // 포지션
    $('#posList').addEventListener('click', e => { const b = e.target.closest('[data-ps]'); if(!b) return; const i = +b.closest('.pseg').dataset.i; const p = S.players[i]; if(!p) return;
      p.pos = b.dataset.ps === 'N' ? null : b.dataset.ps; refreshPeople(); });
    f.onsubmit = e => { e.preventDefault(); sync(); if(inp.value.trim()){ addPeople(inp.value); inp.value=''; } makeDraft(); };
  }
  const v = $('#view');
  v.querySelectorAll('[data-sc]').forEach(inp => inp.addEventListener('change', () => scoreChange(inp)));
}
function makeDraft(){
  const S = UI.draw.form, plist = S.players, names = plist.map(p=>p.name), doubles = S.mode==='doubles';
  const positions = doubles ? plist.map(p=>p.pos) : [];
  const { M, per } = drawShape(names.length, S.courts, doubles);
  if(M < 1){ toast(`최소 ${per}명이 필요해요`); return; }
  if(names.length > 200){ toast('참가자는 200명까지 가능해요'); return; }
  const sig = JSON.stringify([S.mode, S.courts, S.rounds, plist.map(p=>[p.name, doubles ? p.pos : null])]);
  const base = UI.draw.editBase; UI.draw.editBase = null;
  const title = S.title.trim() || `${fmtDate(today())} ${doubles?'복식':'단식'} 대진표`;
  if(base && base.sig === sig){ // 조건이 그대로면 기존 조합 유지, 이름만 반영
    UI.draw.draft = { ...base, title }; UI.draw.view = 'rounds'; UI.draw.copy = false; render(); window.scrollTo(0,0); toast('수정했어요'); return;
  }
  toast(base ? '바뀐 조건으로 다시 짜는 중…' : '조합을 계산하는 중…');
  setTimeout(() => {
    const rounds = genSchedule(names.length, S.courts, S.rounds, doubles, positions);
    UI.draw.draft = { kind:'draw', title:S.title.trim() || `${fmtDate(today())} ${doubles?'복식':'단식'} 대진표`, date:today(), mode:S.mode, courts:S.courts, players:names, positions, rounds, sig };
    UI.draw.view = 'rounds'; UI.draw.copy = false; render(); window.scrollTo(0,0);
  }, 30);
}
let scoreQueue = Promise.resolve();
function scoreChange(inp){
  const d = Data.get(UI.draw.open); if(!d) return;
  const [ri, mi, side] = inp.dataset.sc.split('-').map(Number);
  const val = inp.value === '' ? null : Math.min(99, num(inp.value));
  const rounds = JSON.parse(JSON.stringify(d.rounds));
  const mt = rounds[ri].matches[mi]; if(mt['s'+side] === val) return;
  mt['s'+side] = val;
  const rec = { ...d, rounds };
  if(Data.mode==='local' || !Data.col){ setTimeout(() => Data.save(rec), 0); return; }
  const i = Data.list.findIndex(r=>r.id===d.id); if(i>=0) Data.list[i] = rec;
  setTimeout(() => { scoreQueue = scoreQueue.then(() => Data.save(rec)).catch(()=>{}); }, 0);
}
async function drawAction(a, t){
  const S = UI.draw, v = t.dataset.v;
  if(a==='setRounds'){ S.form.rounds = +v; render(); }
  else if(a==='sample'){ S.form.players = samplePlayers(); refreshPeople(); }
  else if(a==='clearNames'){ if(!S.form.players.length) return; if(await ask('참가자를 모두 지울까요?','전체 삭제',true)){ S.form.players = []; refreshPeople(); } }
  else if(a==='view'){ S.view = v; render(); }
  else if(a==='back'){ S.editBase = null; S.draft = null; S.open = null; S.copy = false; render(); }
  else if(a==='edit'){ S.editBase = S.draft; S.draft = null; render(); window.scrollTo(0,0); }
  else if(a==='open'){ S.open = t.dataset.id; S.view = 'rounds'; S.copy = false; render(); window.scrollTo(0,0); }
  else if(a==='save'){ try { const { sig:_sig, ...dr } = S.draft; const rec = await Data.save(dr); S.draft = null; S.open = rec.id; S.view='rounds'; render(); toast('저장했어요. 경기 후 점수를 입력하세요'); } catch(e){} }
  else if(a==='delete'){ const dd = Data.get(t.dataset.id); const nmT = esc((dd && dd.title) || '이 대진표');
    if(await ask(`<b style="font-size:16px">정말 삭제하시겠습니까?</b><br><span style="color:var(--muted);font-size:13.5px">‘${nmT}’ 대진표와 입력한 점수가 모두 삭제되며, 되돌릴 수 없어요.</span>`,'삭제',true)){ try { await Data.remove(t.dataset.id); S.open = null; render(); toast('삭제했어요'); } catch(e){} } }
  else if(a==='copy'){
    const d = S.open ? Data.get(S.open) : S.draft; const txt = drawText(d);
    try { await navigator.clipboard.writeText(txt); toast('대진표를 복사했어요'); S.copy = false; }
    catch(e){ S.copy = true; render(); }
  }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act],[data-open],[data-filter],[data-close],[data-edit],[data-del],[data-bk],[data-dr]');
  if(!t) { if(e.target.id==='scrim') closeSheet(); return; }
  const d = t.dataset;
  if(d.tab){ if(!ENABLED_TABS.includes(d.tab)) return; UI.tab = d.tab; closeSheet(); render(); window.scrollTo(0,0); }
  else if(d.act==='newMatch') matchForm();
  else if(d.act==='newPractice') practiceForm();
  else if(d.act==='newBooking') bookingForm();
  else if(d.act==='toggleAnalyst'){ UI.analyst = !UI.analyst; render(); }
  else if(d.open) detail(d.open);
  else if(d.filter){ UI.recFilter = d.filter; render(); }
  else if('close' in d) closeSheet();
  else if(d.edit){ const r = Data.get(d.edit); r.kind==='match' ? matchForm(r) : practiceForm(r); }
  else if(d.del){ if(await ask('이 기록을 삭제할까요?','삭제',true)){ try{ await Data.remove(d.del); closeSheet(); toast('삭제했어요'); }catch(err){ toast('삭제하지 못했어요'); } } }
  else if(d.bk){
    const b = Data.get(d.id); if(!b) return;
    if(d.bk==='confirm'){ try{ const nb = await Data.save({...b, status:'confirmed'}); toast('예약을 확정했어요'); bookingDetail(nb); }catch(err){} }
    if(d.bk==='report') reportForm(b);
    if(d.bk==='cancel'){ if(await ask('이 분석 예약을 취소할까요?','예약 취소',true)){ try{ await Data.save({...b, status:'canceled'}); closeSheet(); toast('예약을 취소했어요'); }catch(err){} } }
  }
  else if(d.dr) drawAction(d.dr, t);
});
$('#scrim').addEventListener('click', e => { if(e.target.id==='scrim') closeSheet(); });

render();
setSync();
Data.init();
</script>
